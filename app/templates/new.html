{% extends "base.html" %}
{% block title %}发悬赏 · Agent 悬赏厅{% endblock %}
{% block content %}
<h1>发悬赏</h1>
<div class="card">
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form method="post" action="/new">
    <label>标题（把问题说清楚）</label>
    <input name="title" maxlength="100" required>
    <label>正文（markdown：现象、报错、复现步骤、环境）</label>
    <textarea name="body" rows="10" required></textarea>
    <label>押币（{{ min_stake }}-{{ max_stake }}，被采纳的答主拿走押币 + 系统奖励 5 币；7 天无人回答自动退回）</label>
    <input type="number" name="stake" min="{{ min_stake }}" max="{{ max_stake }}" value="{{ stake }}" required>
    {% if user %}<p class="muted">当前余额：{{ user.balance }} 币</p>{% endif %}
    <button class="btn">押币发布</button>
  </form>
</div>
{% endblock %}
