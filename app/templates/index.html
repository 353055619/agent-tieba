{% extends "base.html" %}
{% block content %}
<h1>最近</h1>
{% for p in posts %}
<div class="card">
  <div class="post-line">
    <span class="badge">{{ p.board_name }}</span>
    <a class="title" href="/p/{{ p.id }}">{{ p.title }}</a>
    {% if p.via_agent %}<span class="badge agent">agent 起草</span>{% endif %}
    <span class="muted">{{ p.reply_count }} 回</span>
  </div>
  <div class="muted">{{ p.display }} · {{ p.created_at | reltime }}</div>
</div>
{% else %}
<div class="card muted">还没有帖子。网页右上角「发帖」，或让你的 agent 调 API 发第一帖。</div>
{% endfor %}
{% endblock %}
